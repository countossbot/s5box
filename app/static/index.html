<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>subswarm · 多订阅随机负载代理</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a href="#main" class="skip-link">跳到主内容</a>
<header>
  <div class="brand">subswarm<span class="dot" aria-hidden="true"></span></div>
  <nav id="tabs" role="tablist" aria-label="面板页签">
    <button data-tab="overview" class="active" role="tab" aria-selected="true" aria-controls="tab-overview">概览</button>
    <button data-tab="spaces" role="tab" aria-selected="false" aria-controls="tab-spaces">订阅空间</button>
    <button data-tab="nodes" role="tab" aria-selected="false" aria-controls="tab-nodes">节点</button>
    <button data-tab="logs" role="tab" aria-selected="false" aria-controls="tab-logs">连接日志</button>
    <button data-tab="settings" role="tab" aria-selected="false" aria-controls="tab-settings">设置</button>
  </nav>
  <div class="head-right">
    <span id="conn-badge" class="badge">活跃 0</span>
    <button id="btn-refresh-all" class="ghost">刷新全部订阅</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- 概览 -->
  <section id="tab-overview" class="tab active">
    <div class="cards" id="ov-cards"></div>
    <div class="grid2">
      <div class="panel">
        <h3>随机选择分布 <small>最近 200 次连接</small></h3>
        <div id="dist-space" class="bars"></div>
      </div>
      <div class="panel">
        <h3>热门节点 <small>最近 200 次连接</small></h3>
        <div id="dist-node" class="bars"></div>
      </div>
    </div>
    <div class="panel">
      <h3>sing-box 实例</h3>
      <div class="table-wrap">
        <table id="inst-table"><caption class="sr-only">sing-box 实例</caption><thead><tr><th scope="col">空间</th><th scope="col">私有 socks 端口</th><th scope="col">状态</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
  </section>

  <!-- 空间 -->
  <section id="tab-spaces" class="tab">
    <div class="panel">
      <h3>新增订阅空间</h3>
      <div class="form-row">
        <input id="sp-url" placeholder="https://example.com/sub?token=..." spellcheck="false">
        <input id="sp-name" placeholder="空间名（留空自动生成）">
        <button id="btn-add-space" class="primary">添加并拉取</button>
      </div>
      <details>
        <summary>批量导入多个订阅链接（每行一个）</summary>
        <textarea id="bulk-urls" rows="5" placeholder="每行一个订阅链接"></textarea>
        <button id="btn-bulk" class="ghost">批量创建</button>
      </details>
    </div>
    <div class="panel">
      <h3>空间列表</h3>
      <div class="table-wrap">
        <table id="sp-table">
          <caption class="sr-only">订阅空间列表</caption>
          <thead><tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">节点</th><th scope="col">订阅</th><th scope="col">权重</th><th scope="col">上次刷新</th><th scope="col">操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 节点 -->
  <section id="tab-nodes" class="tab">
    <div class="panel">
      <h3>节点 <small id="node-count"></small> <small id="node-sel" class="row-count"></small></h3>
      <div class="form-row" role="search">
        <label for="f-space" class="sr-only">按空间筛选</label>
        <select id="f-space" aria-label="按空间筛选"><option value="">全部空间</option></select>
        <label for="f-state" class="sr-only">按状态筛选</label>
        <select id="f-state" aria-label="按状态筛选">
          <option value="all">全部状态</option>
          <option value="healthy">健康</option>
          <option value="unknown">未探测</option>
          <option value="cooling">探测失败</option>
          <option value="deleted">已删除</option>
        </select>
        <input id="f-q" type="search" placeholder="搜索名称 / IP / 协议" aria-label="搜索节点">
        <span class="spacer"></span>
        <div class="toolbar-actions">
          <button id="btn-bulk-revive" class="ghost">复活选中</button>
          <button id="btn-bulk-delete" class="danger ghost" aria-label="删除选中的节点">删除选中</button>
          <button id="btn-probe-all" class="primary">立即全量探测</button>
        </div>
      </div>
      <div id="node-loading" class="loading-line" hidden></div>
      <div class="table-wrap">
        <table id="node-table">
          <caption class="sr-only">节点列表</caption>
          <thead><tr>
            <th scope="col"><input type="checkbox" id="chk-all" aria-label="全选当前列表节点"></th>
            <th scope="col">空间</th><th scope="col">名称</th><th scope="col">协议</th><th scope="col">地址</th>
            <th scope="col">状态</th><th scope="col">延迟</th><th scope="col">出口 IP</th>
            <th scope="col">失败</th><th scope="col" style="text-align:right">操作</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 日志 -->
  <section id="tab-logs" class="tab">
    <div class="panel">
      <h3>连接日志 <small>每次连接记录它随机命中了哪个空间/节点</small></h3>
      <div class="form-row">
        <span class="row-count">最近 200 条（演示数据来自当前运行实例）</span>
        <span class="spacer"></span>
        <button id="btn-log-refresh" class="ghost">刷新</button>
      </div>
      <div id="log-loading" class="loading-line" hidden></div>
      <div class="table-wrap">
        <table id="log-table">
          <caption class="sr-only">连接日志</caption>
          <thead><tr><th scope="col">时间</th><th scope="col">客户端</th><th scope="col">协议</th><th scope="col">目标</th><th scope="col">空间</th><th scope="col">节点</th><th scope="col">结果</th><th scope="col">详情</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings" class="tab">
    <div class="panel">
      <h3>探测</h3>
      <div class="set-grid" id="set-probe"></div>
    </div>
    <div class="panel">
      <h3>随机与代理</h3>
      <div class="set-grid" id="set-random"></div>
    </div>
    <div class="panel">
      <h3>自动过滤</h3>
      <div class="set-grid" id="set-filter"></div>
    </div>
    <div class="panel save-bar">
      <button id="btn-save-settings" class="primary">保存设置</button>
      <span id="save-msg" class="save-msg" role="status"></span>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modal-host"></div>
<script src="/static/app.js"></script>
</body>
</html>
